# Desktop M1 (Windows): bangun NH-AI-Clip-Studio-Setup.exe dan UJI SUNGGUHAN di runner Windows.
#   1. siapkan bundel: FFmpeg (versi & sha256 dikunci, libass/libx264 diverifikasi), Whisper small (lisensi MIT dicek; base hanya pembanding, tidak dibundel),
#      sampel video ucapan (suara SAPI Windows, offline)
#   2. selftest dari kode sumber
#   3. PyInstaller (onedir) -> selftest exe beku dengan koneksi keluar DIBLOKIR firewall dan PATH tanpa Python/FFmpeg
#   4. Inno Setup -> pasang diam-diam (per pengguna) -> selftest aplikasi terpasang (folder bawaan) -> jendela GUI
#      (tangkapan layar) -> uninstall (proyek pengguna tetap ada)
#   5. artefak: installer + laporan + log
# Catatan jujur: runner GitHub BUKAN Windows bersih (ada Python, VC++ runtime, dll.). Tanpa tanda tangan kode.
# Tidak menyentuh VPS/DNS/cPanel/website; tidak memakai secret.
name: Desktop Windows

on:
  push:
    branches: ["desktop/**"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read          # unduh installer M1 (artefak run sebelumnya) untuk uji pembaruan M1 -> M1.1

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  FFMPEG_URL: https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-essentials_build.zip
  FFMPEG_SHA256: 04861d3339c5ebe38b56c19a15cf2c0cc97f5de4fa8910e4d47e5e6404e4a2d4  # pragma: allowlist secret (sha256 berkas publik)
  WHISPER_REPOS: "small=Systran/faster-whisper-small"      # installer utama: model standar saja
  WHISPER_COMPARE_REPO: Systran/faster-whisper-base           # hanya untuk bukti sebelum/sesudah (perilaku M1), TIDAK dibundel
  WHISPER_ADDON_REPO: mobiuslabsgmbh/faster-whisper-large-v3-turbo
  M1_RUN_ID: "42754779950"   # build installer M1 (desktop/m1 @ 6952a43) untuk uji pembaruan
  PYTHONUTF8: "1"

jobs:
  windows-installer:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Pasang dependensi desktop
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r desktop/requirements-desktop.txt
          python -m pip freeze | Tee-Object build-freeze.txt

      - name: Uji cepat modul khusus Windows (kunci berkas, RAM, impor app)
        run: python desktop/ci/windows_smoke.py

      - name: Periksa lisensi paket Python yang dibundel
        run: |
          New-Item -ItemType Directory -Force build/desktop/licenses | Out-Null
          pip-licenses --format=markdown --with-urls --output-file build/desktop/licenses/python-packages.md
          # Gagal bila ada paket GPL/AGPL di aplikasi (PyInstaller hanya alat build; bootloader-nya GPL + pengecualian).
          pip-licenses --partial-match --fail-on="GPL;AGPL;Commercial;Proprietary" `
            --ignore-packages pyinstaller pyinstaller-hooks-contrib pip-licenses

      - name: Unduh FFmpeg (dikunci sha256) dan verifikasi libass/libx264
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest $env:FFMPEG_URL -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:FFMPEG_SHA256) { throw "sha256 FFmpeg tidak cocok: $hash" }
          Expand-Archive $zip "$env:RUNNER_TEMP\ffmpeg" -Force
          $src = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force build/desktop/bin | Out-Null
          Copy-Item "$($src.FullName)\bin\ffmpeg.exe", "$($src.FullName)\bin\ffprobe.exe" build/desktop/bin/
          Copy-Item "$($src.FullName)\LICENSE" build/desktop/licenses/FFmpeg-LICENSE-GPLv3.txt
          Copy-Item "$($src.FullName)\README.txt" build/desktop/licenses/FFmpeg-README-build-and-source.txt
          $conf = & build/desktop/bin/ffmpeg.exe -hide_banner -buildconf | Out-String
          foreach ($need in "--enable-libass", "--enable-libx264", "--enable-libfreetype", "--enable-libfribidi") {
            if ($conf -notmatch [regex]::Escape($need)) { throw "FFmpeg tanpa $need" }
          }
          & build/desktop/bin/ffmpeg.exe -hide_banner -version | Select-Object -First 1

      - name: Unduh model Whisper small (standar), base (pembanding M1, tidak dibundel), lisensi MIT, dan ikon
        run: |
          foreach ($pair in $env:WHISPER_REPOS.Split(" ")) {
            $name, $repo = $pair.Split("=")
            python desktop/ci/fetch_whisper.py $repo "build/desktop/whisper-$name"
            if ($LASTEXITCODE -ne 0) { throw "unduh model $name gagal" }
            Get-ChildItem "build/desktop/whisper-$name" | Select-Object Name, Length
          }
          python desktop/ci/fetch_whisper.py $env:WHISPER_COMPARE_REPO build/compare-models/whisper-base
          if ($LASTEXITCODE -ne 0) { throw "unduh model pembanding gagal" }
          # Paket tambahan OPSIONAL (bukan installer utama): large-v3-turbo -> mode "Kualitas tinggi"
          python desktop/ci/fetch_whisper.py $env:WHISPER_ADDON_REPO build/addon/whisper-large-v3-turbo
          if ($LASTEXITCODE -ne 0) { throw "unduh model tambahan gagal" }
          Get-ChildItem build/addon/whisper-large-v3-turbo | Select-Object Name, Length
          python -c "from PIL import Image; Image.open('web/icons/icon-512.png').save('build/desktop/app.ico', sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Buat sampel video bahasa Indonesia asli (FLEURS id_id, CC-BY 4.0) + transkrip rujukan
        run: |
          New-Item -ItemType Directory -Force build/test | Out-Null
          python desktop/ci/make_id_sample.py build/desktop/bin/ffmpeg.exe build/test/speech.mp4 --seconds 150
          if ($LASTEXITCODE -ne 0) { throw "sampel Indonesia gagal" }

      - name: Selftest dari kode sumber
        env:
          FFMPEG_BIN: ${{ github.workspace }}\build\desktop\bin\ffmpeg.exe
          FFPROBE_BIN: ${{ github.workspace }}\build\desktop\bin\ffprobe.exe
          WHISPER_MODEL_ACCURATE: small
          WHISPER_MODEL: small
        run: |
          $env:WHISPER_MODEL_PATHS = (@{ small = "$PWD\build\desktop\whisper-small" } | ConvertTo-Json -Compress)
          python -m desktop.launcher --selftest build/test/speech.mp4 --report build/test/report-source.json `
            --language id --quality akurat --reference build/test/speech.txt `
            --data-dir "$env:RUNNER_TEMP\src-data" --export-dir "$env:RUNNER_TEMP\src-export"
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:RUNNER_TEMP\src-data\logs\desktop.log" -Tail 80; throw "selftest sumber gagal" }

      - name: Bukti sebelum/sesudah (M1 vs M1.1, rentang & video sama, tanpa koreksi manual)
        env:
          FFMPEG_BIN: ${{ github.workspace }}\build\desktop\bin\ffmpeg.exe
          FFPROBE_BIN: ${{ github.workspace }}\build\desktop\bin\ffprobe.exe
          WHISPER_MODEL_ACCURATE: small
          WHISPER_MODEL: small
        run: |
          $env:M1_BASE_MODEL_DIR = "$PWD\build\compare-models\whisper-base"
          $env:WHISPER_MODEL_PATHS = (@{ small = "$PWD\build\desktop\whisper-small" } | ConvertTo-Json -Compress)
          python desktop/ci/before_after.py build/test/speech.mp4 build/test/speech.txt build/compare --start 0 --end 40
          if ($LASTEXITCODE -ne 0) { throw "sebelum/sesudah gagal" }

      - name: Build PyInstaller (onedir)
        run: |
          pyinstaller desktop/nh_clip_studio.spec --noconfirm --clean --distpath dist --workpath build/pyi
          $internal = "dist/NH-AI-Clip-Studio/_internal"
          foreach ($dll in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") {
            if (-not (Get-ChildItem $internal -Recurse -Filter $dll -ErrorAction SilentlyContinue)) {
              Write-Host "Menyalin $dll (VC++ runtime) agar jalan di Windows tanpa VC++ Redistributable"
              Copy-Item "$env:WINDIR\System32\$dll" $internal
            }
          }
          # Keputusan M1.1: hanya Whisper small di installer utama (base dihapus, turbo = paket tambahan)
          $bundled = Get-ChildItem $internal -Directory -Filter "whisper-*" | ForEach-Object Name
          "Model di bundel: $($bundled -join ', ')"
          if (($bundled -join ',') -ne "whisper-small") { throw "bundel harus hanya berisi whisper-small" }
          $size = (Get-ChildItem dist/NH-AI-Clip-Studio -Recurse | Measure-Object Length -Sum).Sum
          "Ukuran folder aplikasi: {0:N1} MB" -f ($size / 1MB)

      - name: Selftest exe beku (koneksi keluar diblokir, PATH tanpa Python/FFmpeg)
        run: |
          Set-NetFirewallProfile -All -Enabled True
          $exe = (Resolve-Path dist/NH-AI-Clip-Studio/NH-AI-Clip-Studio.exe).Path
          $remote = @("0.0.0.0-126.255.255.255", "128.0.0.0-255.255.255.255", "2000::/3")
          New-NetFirewallRule -DisplayName "nh-block-exe" -Direction Outbound -Program $exe -RemoteAddress $remote -Action Block | Out-Null
          # Bukti aturan memblokir: program yang sama-sama diblokir (python) tidak bisa menjangkau internet.
          $py = (Get-Command python).Source
          New-NetFirewallRule -DisplayName "nh-block-probe" -Direction Outbound -Program $py -RemoteAddress $remote -Action Block | Out-Null
          python -c "import urllib.request as u; u.urlopen('https://huggingface.co', timeout=10)"
          if ($LASTEXITCODE -eq 0) { throw "aturan firewall tidak memblokir; uji offline tidak sah" }
          Write-Host "Aturan firewall terbukti memblokir koneksi keluar."
          Remove-NetFirewallRule -DisplayName "nh-block-probe"
          $env:PATH = "$env:WINDIR\System32;$env:WINDIR;$env:WINDIR\System32\Wbem"
          Remove-Item Env:PYTHONPATH, Env:PYTHONHOME -ErrorAction SilentlyContinue
          $p = Start-Process $exe -ArgumentList "--selftest", "`"$PWD\build\test\speech.mp4`"", "--report", "`"$PWD\build\test\report-frozen.json`"", `
            "--language", "id", "--quality", "akurat", "--reference", "`"$PWD\build\test\speech.txt`"", `
            "--data-dir", "`"$env:RUNNER_TEMP\frozen-data`"", "--export-dir", "`"$env:RUNNER_TEMP\frozen-export`"" -Wait -PassThru
          Get-Content build/test/report-frozen.json -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\frozen-data\logs\desktop.log" -Tail 120; throw "selftest exe gagal ($($p.ExitCode))" }
          exit 0   # Start-Process tidak mengubah $LASTEXITCODE (masih 1 dari uji blokir python di atas)

      - name: Build installer (Inno Setup)
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc "/DAppVersion=0.1.1-m11.${{ github.run_number }}" desktop/installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC gagal" }
          $setup = Get-Item dist/installer/NH-AI-Clip-Studio-Setup.exe
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "NH-AI-Clip-Studio-Setup.exe: {0:N1} MB, sha256 {1}" -f ($setup.Length / 1MB), $hash | Tee-Object build/test/installer.txt
          & $iscc "/DAppVersion=0.1.1-m11.${{ github.run_number }}" desktop/model_addon.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC paket model gagal" }
          $addon = Get-Item dist/installer/NH-AI-Clip-Studio-Model-KualitasTinggi.exe
          $ahash = (Get-FileHash $addon -Algorithm SHA256).Hash.ToLower()
          "NH-AI-Clip-Studio-Model-KualitasTinggi.exe (opsional): {0:N1} MB, sha256 {1}" -f ($addon.Length / 1MB), $ahash | Tee-Object -Append build/test/installer.txt

      - name: Pasang versi M1 & buat proyek dengan M1 (untuk uji pembaruan)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download $env:M1_RUN_ID -R $env:GITHUB_REPOSITORY -n NH-AI-Clip-Studio-Setup -D build/m1
          if ($LASTEXITCODE -ne 0) { throw "unduh installer M1 gagal" }
          $m1 = (Resolve-Path build/m1/NH-AI-Clip-Studio-Setup.exe).Path
          "Installer M1: {0:N1} MB, sha256 {1}" -f ((Get-Item $m1).Length / 1MB), (Get-FileHash $m1 -Algorithm SHA256).Hash.ToLower() | Tee-Object build/test/update.txt
          $p = Start-Process $m1 -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/LOG=`"$PWD\build\test\install-m1.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "instalasi M1 gagal ($($p.ExitCode))" }
          $app = "$env:LOCALAPPDATA\Programs\NH AI Clip Studio"
          if (-not (Test-Path "$app\_internal\whisper-base\model.bin")) { throw "M1 terpasang tanpa model base?" }
          # Proyek nyata dibuat oleh M1: upload -> analisis -> resep editing disimpan -> render MP4 (selftest M1).
          $p = Start-Process "$app\NH-AI-Clip-Studio.exe" -ArgumentList "--selftest", "`"$PWD\build\test\speech.mp4`"", "--report", "`"$PWD\build\test\report-m1.json`"" -Wait -PassThru
          Get-Content build/test/report-m1.json -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "selftest M1 gagal ($($p.ExitCode))" }
          $data = "$env:LOCALAPPDATA\NH AI Clip Studio"
          python -m desktop.datacheck snapshot "$data" build/test/data-before.json
          python -m desktop.datacheck snapshot "$env:USERPROFILE\Videos\NH AI Clip Studio" build/test/export-before.json
          if ($LASTEXITCODE -ne 0) { throw "snapshot gagal" }
          $snap = Get-Content build/test/data-before.json -Raw | ConvertFrom-Json
          "Data M1: $($snap.files.PSObject.Properties.Count) berkas; tabel: $($snap.tables | ConvertTo-Json -Compress)" | Tee-Object -Append build/test/update.txt
          if ($snap.tables.projects -lt 1 -or $snap.tables.renders -lt 1) { throw "M1 tidak membuat proyek/render" }
          exit 0

      - name: Pasang M1.1 di atas M1 (update), periksa data lama, selftest, GUI, uninstall
        run: |
          $setup = (Resolve-Path dist/installer/NH-AI-Clip-Studio-Setup.exe).Path
          $p = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/TASKS=desktopicon", `
            "/LOG=`"$PWD\build\test\install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "instalasi gagal ($($p.ExitCode))" }
          $app = "$env:LOCALAPPDATA\Programs\NH AI Clip Studio"
          $exe = "$app\NH-AI-Clip-Studio.exe"
          if (-not (Test-Path $exe)) { throw "exe tidak terpasang di $app" }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter "NH AI Clip Studio.lnk"
          if (-not $lnk) { throw "shortcut Start Menu tidak ada" }
          "Terpasang di $app; shortcut: $($lnk.FullName)"
          if (Test-Path "$app\_internal\whisper-base") { throw "berkas model base M1 masih tertinggal setelah update" }
          if (-not (Test-Path "$app\Panduan Uji Akurasi NH.txt")) { throw "panduan uji NH tidak terpasang" }
          $data = "$env:LOCALAPPDATA\NH AI Clip Studio"
          # Uji pembaruan: berkas & tabel proyek M1 utuh setelah installer M1.1 dijalankan, lalu terbaca oleh M1.1.
          python -m desktop.datacheck snapshot "$data" build/test/data-after-install.json
          python -m desktop.datacheck compare build/test/data-before.json build/test/data-after-install.json | Tee-Object build/test/update-compare-install.json
          if ($LASTEXITCODE -ne 0) { throw "data M1 berubah/hilang setelah instalasi M1.1" }
          $p = Start-Process $exe -ArgumentList "--check-data", "--report", "`"$PWD\build\test\update-check.json`"" -Wait -PassThru
          Get-Content build/test/update-check.json -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Get-Content "$data\logs\desktop.log" -Tail 120; throw "M1.1 tidak dapat membaca proyek M1" }
          python -m desktop.datacheck snapshot "$data" build/test/data-after-open.json
          python -m desktop.datacheck compare build/test/data-before.json build/test/data-after-open.json | Tee-Object build/test/update-compare-open.json
          if ($LASTEXITCODE -ne 0) { throw "data M1 berubah/hilang setelah M1.1 dibuka" }
          python -m desktop.datacheck snapshot "$env:USERPROFILE\Videos\NH AI Clip Studio" build/test/export-after.json
          python -m desktop.datacheck compare build/test/export-before.json build/test/export-after.json | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "hasil ekspor M1 hilang/berubah setelah update" }
          $chk = Get-Content build/test/update-check.json -Raw | ConvertFrom-Json
          "Update M1 -> M1.1: $($chk.projects) proyek M1 terbaca (transkrip, resep, klip, render); berkas & tabel utuh; model base lama dibersihkan." | Tee-Object -Append build/test/update.txt

          $env:PATH = "$env:WINDIR\System32;$env:WINDIR;$env:WINDIR\System32\Wbem"
          Remove-Item Env:PYTHONPATH, Env:PYTHONHOME -ErrorAction SilentlyContinue
          New-NetFirewallRule -DisplayName "nh-block-installed" -Direction Outbound -Program $exe `
            -RemoteAddress @("0.0.0.0-126.255.255.255", "128.0.0.0-255.255.255.255", "2000::/3") -Action Block | Out-Null
          # Folder bawaan pengguna: %LOCALAPPDATA%\NH AI Clip Studio dan Videos\NH AI Clip Studio
          # Model standar (small) di aplikasi terpasang, folder bawaan pengguna.
          $p = Start-Process $exe -ArgumentList "--selftest", "`"$PWD\build\test\speech.mp4`"", "--report", "`"$PWD\build\test\report-installed.json`"", `
            "--language", "id", "--quality", "akurat", "--reference", "`"$PWD\build\test\speech.txt`"" -Wait -PassThru
          Get-Content build/test/report-installed.json -ErrorAction SilentlyContinue
          $data = "$env:LOCALAPPDATA\NH AI Clip Studio"
          if ($p.ExitCode -ne 0) { Get-Content "$data\logs\desktop.log" -Tail 120; throw "selftest aplikasi terpasang gagal" }
          # Paket tambahan opsional: pasang, lalu mode "Kualitas tinggi" (turbo) harus muncul & jalan.
          $p = Start-Process (Resolve-Path dist/installer/NH-AI-Clip-Studio-Model-KualitasTinggi.exe).Path `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/LOG=`"$PWD\build\test\install-addon.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "instalasi paket model gagal ($($p.ExitCode))" }
          if (-not (Test-Path "$data\models\whisper-large-v3-turbo\model.bin")) { throw "model tambahan tidak terpasang" }
          New-NetFirewallRule -DisplayName "nh-block-installed-2" -Direction Outbound -Program $exe `
            -RemoteAddress @("0.0.0.0-126.255.255.255", "128.0.0.0-255.255.255.255", "2000::/3") -Action Block | Out-Null
          $p = Start-Process $exe -ArgumentList "--selftest", "`"$PWD\build\test\speech.mp4`"", "--report", "`"$PWD\build\test\report-installed-tinggi.json`"", `
            "--language", "id", "--quality", "tinggi", "--reference", "`"$PWD\build\test\speech.txt`"", "--export-dir", "`"$env:RUNNER_TEMP\export-tinggi`"" -Wait -PassThru
          Get-Content build/test/report-installed-tinggi.json -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Get-Content "$data\logs\desktop.log" -Tail 120; throw "selftest Kualitas tinggi gagal" }
          # Alat uji NH (--eval) di Windows: Standar & Kualitas Tinggi x 2 run pada sampel Indonesia (laporan tanpa video).
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\uji-nh" | Out-Null
          Copy-Item build/test/speech.mp4 "$env:RUNNER_TEMP\uji-nh\fleurs-id.mp4"
          Copy-Item build/test/speech.txt "$env:RUNNER_TEMP\uji-nh\fleurs-id.txt"
          $p = Start-Process $exe -ArgumentList "--eval", "`"$env:RUNNER_TEMP\uji-nh`"", "--runs", "2" -Wait -PassThru
          Copy-Item "$env:RUNNER_TEMP\uji-nh\laporan-uji.md", "$env:RUNNER_TEMP\uji-nh\laporan-uji.json" build/test/ -ErrorAction SilentlyContinue
          Get-Content build/test/laporan-uji.md -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "alat uji --eval gagal ($($p.ExitCode))" }

          $export = "$env:USERPROFILE\Videos\NH AI Clip Studio"
          $mp4 = Get-ChildItem $export -Recurse -Filter *.mp4
          "MP4 di folder ekspor bawaan: $($mp4.Count)"
          if ($mp4.Count -lt 6) { throw "folder ekspor bawaan kurang dari 6 MP4" }

          # GUI: buka seperti pengguna (tanpa argumen), tunggu server, ambil tangkapan layar jendela.
          $env:NH_SILENT = "1"
          $gui = Start-Process $exe -PassThru
          $ok = $false
          foreach ($i in 1..90) {
            Start-Sleep 2
            try { if ((Invoke-WebRequest http://127.0.0.1:47811/api/health -UseBasicParsing -TimeoutSec 3).StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          if (-not $ok) { Get-Content "$data\logs\desktop.log" -Tail 80; throw "server GUI tidak siap" }
          Start-Sleep 15
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\build\test\gui-window.png")
          $second = Start-Process $exe -PassThru
          if (-not $second.WaitForExit(30000)) { throw "salinan kedua tidak keluar (kunci satu instans gagal)" }
          Select-String -Path "$data\logs\desktop.log" -Pattern "Membuka jendela|browser bawaan|sudah terbuka" | Select-Object -Last 5
          if ($gui.HasExited) { throw "aplikasi GUI tertutup sendiri" }
          Stop-Process -Id $gui.Id -Force
          Start-Sleep 3

          $projects = (Get-ChildItem "$data\projects" -Directory).Count
          $p = Start-Process "$app\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          Start-Sleep 5
          if (Test-Path $exe) { throw "uninstall tidak menghapus aplikasi" }
          if ((Get-ChildItem "$data\projects" -Directory).Count -ne $projects) { throw "uninstall menghapus proyek pengguna" }
          "Uninstall OK; $projects proyek pengguna & hasil ekspor tetap ada." | Tee-Object build/test/uninstall.txt
          Copy-Item "$data\logs\desktop.log" build/test/desktop-installed.log
          exit 0

      - name: Ringkasan
        if: always()
        run: |
          "## NH AI Clip Studio — build Windows" >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path build/test/installer.txt) { Get-Content build/test/installer.txt >> $env:GITHUB_STEP_SUMMARY }
          if (Test-Path build/test/update.txt) { Get-Content build/test/update.txt >> $env:GITHUB_STEP_SUMMARY }
          if (Test-Path build/test/laporan-uji.md) { Get-Content build/test/laporan-uji.md >> $env:GITHUB_STEP_SUMMARY }
          foreach ($r in "source", "frozen", "installed", "installed-tinggi") {
            $f = "build/test/report-$r.json"
            if (Test-Path $f) {
              $j = Get-Content $f -Raw | ConvertFrom-Json
              "- selftest ${r}: ok=$($j.ok) model=$($j.model) ($($j.quality)) WER=$($j.accuracy.wer) CER=$($j.accuracy.cer) analisis=$($j.analysis_seconds)s/$($j.video_seconds)s render=$($j.render_seconds)s kata=$($j.transcript_words) tidak-yakin=$($j.unsure_share) mp4=$($j.outputs.Count)" >> $env:GITHUB_STEP_SUMMARY
            } else { "- selftest ${r}: tidak ada laporan" >> $env:GITHUB_STEP_SUMMARY }
          }

      - name: Unggah installer
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: NH-AI-Clip-Studio-Setup
          path: dist/installer/NH-AI-Clip-Studio-Setup.exe
          retention-days: 30
          compression-level: 0

      - name: Unggah paket model tambahan (opsional)
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: NH-AI-Clip-Studio-Model-KualitasTinggi
          path: dist/installer/NH-AI-Clip-Studio-Model-KualitasTinggi.exe
          retention-days: 30
          compression-level: 0

      - name: Unggah laporan uji
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: desktop-test-reports
          path: |
            build/test/*.json
            build/test/*.txt
            build/test/*.log
            build/test/*.png
            build/desktop/licenses/
            build-freeze.txt
          retention-days: 30

      - name: Unggah bukti sebelum/sesudah (MP4)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: m11-sebelum-sesudah
          path: build/compare/
          retention-days: 30
