# CI (P5.3). Tanpa API AI berbayar, tanpa GPU, tanpa unduhan model (HF_HUB_OFFLINE=1). Tes berat (Whisper asli)
# hanya lewat "Run workflow" dengan input heavy=true. Tidak ada secret yang dipakai; artifact hanya laporan teks.
name: CI

on:
  push:
    branches: ["v2/**", "main", "master"]
  pull_request:
  workflow_dispatch:
    inputs:
      heavy:
        description: "Jalankan juga tes khusus Whisper asli (mengunduh model tiny ±75 MB)"
        type: boolean
        default: false
      bench:
        description: "Benchmark P5.5.2: none, smoke, full, remediasi (eksperimen W3/W5/W6/noise)"
        type: choice
        options: [none, smoke, full, remediasi]
        default: none
      bench_models:
        description: "Model Whisper untuk benchmark, dipisah koma (tiny, base, small)"
        type: string
        default: tiny
      bench_runs:
        description: "Jumlah run per skenario benchmark"
        type: string
        default: "3"
      bench_exps:
        description: "Eksperimen remediasi (bench=remediasi), dipisah koma: mem, conc, det, gt, noise, diag"
        type: string
        default: mem,conc,det,gt,noise

permissions:
  contents: read

concurrency:
  # Run manual (benchmark/heavy) punya grup sendiri: tidak dibatalkan push berikutnya & tidak membatalkan CI push.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"          # sama dengan image Docker (python:3.12-slim)
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  HF_HUB_OFFLINE: "1"             # regresi tidak pernah mengunduh model

jobs:
  lint:
    name: Lint & static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Pasang alat lint (versi terkunci di requirements-dev.txt)
        run: grep -E '^(ruff|bandit|check-jsonschema)==' requirements-dev.txt | pip install -r /dev/stdin
      - name: Ruff (pyflakes + kesalahan sintaks)
        run: ruff check app tests bench scripts
      - name: Bandit (analisis keamanan statis; gagal hanya untuk temuan BARU di luar baseline)
        run: bandit -r app -ll -q -b .bandit-baseline.json
      - name: Kompilasi semua modul Python
        run: python -m compileall -q app scripts bench tests
      - name: Sintaks JavaScript
        run: for f in web/*.js; do node --check "$f"; done
      - name: Validasi workflow GitHub Actions
        run: check-jsonschema --builtin-schema vendor.github-workflows .github/workflows/*.yml
      - name: Validasi Docker Compose
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose -f docker-compose.yml -f deploy/compose.staging.yml config --quiet
          rm .env

  security:
    name: Keamanan & lisensi
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0              # pindai seluruh riwayat git
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Pasang alat
        run: grep -E '^(pip-audit|detect-secrets)==' requirements-dev.txt | pip install -r /dev/stdin
      - name: Secret di file saat ini (di luar baseline yang sudah diaudit)
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline --exclude-files '(^|/)(tests/schema_snapshots|fonts|models)/'
      - name: Secret di seluruh riwayat git
        run: python scripts/scan_secrets_history.py
      - name: Kerentanan dependensi (pip-audit, OSV/PyPI advisory)
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Lisensi dependensi produksi (venv berisi requirements.txt saja)
        run: |
          python -m venv /tmp/prod
          /tmp/prod/bin/pip install -q -r requirements.txt
          /tmp/prod/bin/python scripts/check_licenses.py --markdown licenses-python.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: laporan-lisensi
          path: licenses-python.md
          if-no-files-found: ignore
          retention-days: 14

  test-sqlite:
    name: Tes SQLite (unit, integrasi, API, migrasi)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Pytest (tanpa tes heavy)
        run: pytest -q -p no:cacheprovider --junitxml=junit-sqlite.xml --durations=15
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: junit-sqlite
          path: junit-sqlite.xml
          retention-days: 14

  test-postgres:
    name: Tes PostgreSQL (seluruh regresi + migrasi PG)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci  # pragma: allowlist secret (database sementara milik job ini)
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Pytest (tanpa tes heavy)
        run: pytest -q -p no:cacheprovider --junitxml=junit-postgres.xml --durations=15
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: junit-postgres
          path: junit-postgres.xml
          retention-days: 14

  migrations:
    name: Validasi migrasi database
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci  # pragma: allowlist secret (database sementara milik job ini)
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/ci  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Satu head Alembic (tidak ada cabang revisi)
        run: test "$(alembic heads | wc -l)" -eq 1 && alembic heads
      - name: SQL migrasi offline dapat dibuat (untuk ditinjau DBA)
        run: alembic upgrade head --sql > migration.sql && grep -q "CREATE TABLE uploads" migration.sql
      - name: Startup DITOLAK pada PostgreSQL kosong tanpa db-upgrade
        run: |
          if python -c "from app import db; db.engine()" 2> refusal.log; then
            echo "Aplikasi seharusnya menolak start"; exit 1; fi
          grep -q "db-upgrade" refusal.log
      - name: Upgrade database kosong, status & drift
        run: |
          python -m app.manage db-upgrade
          python -m app.manage db-status
          python -m app.manage db-check
          python -c "from app import db; db.engine(); print('start OK')"
      - name: Tes migrasi (database lama P0-P4 berisi data, gagal = rollback, downgrade terlindungi)
        run: pytest -q -p no:cacheprovider tests/test_p5_migrations.py

  heavy:
    name: Tes khusus Whisper asli (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.heavy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HF_HUB_OFFLINE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q -p no:cacheprovider -m heavy

  # ---------------------------------------------------------------- P5.5.2: benchmark (hanya manual, bench != none)
  # Terpisah dari job CI wajib (tanpa `needs` ke/dari job lain). Berjalan di dalam image produksi yang dibangun dari
  # digest run #6; mengunduh model faster-whisper & korpus FLEURS (CC-BY 4.0). Hasil: baris "RINGKASAN" di log +
  # artifact. Kode yang dipakai = ref yang di-dispatch (v2/phase-1).
  bench-config:
    name: Benchmark P5.5.2 — konfigurasi
    if: github.event_name == 'workflow_dispatch' && inputs.bench != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      models: ${{ steps.c.outputs.models }}
      runs: ${{ steps.c.outputs.runs }}
      remediasi: ${{ steps.c.outputs.remediasi }}
    steps:
      - id: c
        env:
          MODELS: ${{ inputs.bench_models }}
          RUNS: ${{ inputs.bench_runs }}
          EXPS: ${{ inputs.bench_exps }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          ok = {"tiny", "base", "small"}
          models = [m.strip() for m in os.environ["MODELS"].split(",") if m.strip()]
          bad = [m for m in models if m not in ok]
          assert models and not bad, f"model tidak didukung: {bad or 'kosong'}"
          runs = int(os.environ["RUNS"])
          assert 1 <= runs <= 10, "bench_runs harus 1-10"
          print("models=" + json.dumps(models))
          print(f"runs={runs}")
          # Matrix remediasi: hanya eksperimen yang dipilih (argumen & batas container tetap di sini, tidak dari input).
          small3g = "--cpus=4 --memory=3g --memory-swap=3g"
          allx = {
              "mem": {"args": "--models tiny,base,small --minutes 10,30,60",
                      "docker": "--cpus=4 --memory=12g --memory-swap=12g"},
              "conc": {"args": "--models small --minutes 10", "docker": small3g},
              "det": {"args": "--models small --sets id_long,id_noisy_snr10,en_clean --runs 3", "docker": small3g},
              "gt": {"args": "--models small", "docker": small3g},
              "noise": {"args": "--models small", "docker": small3g},
              "diag": {"args": "--models small --sets en_clean,id_clean --windows 30,60", "docker": small3g},
          }
          exps = [e.strip() for e in os.environ["EXPS"].split(",") if e.strip()]
          badx = [e for e in exps if e not in allx]
          assert exps and not badx and len(set(exps)) == len(exps), f"bench_exps tidak valid: {badx or exps}"
          print("remediasi=" + json.dumps({"include": [{"exp": e, **allx[e]} for e in exps]}))
          PY

  bench-whisper:
    name: Benchmark Whisper asli (${{ matrix.model }})
    needs: bench-config
    if: inputs.bench == 'smoke' || inputs.bench == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.bench-config.outputs.models) }}
    env:
      PY_DIGEST: python@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159
      # Tingkat workflow memasang HF_HUB_OFFLINE=1 (regresi tidak boleh mengunduh). Job ini SENGAJA mengunduh model
      # & korpus FLEURS (run #15 gagal di langkah korpus karena mode offline masih aktif di host).
      HF_HUB_OFFLINE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Mesin & versi
        run: |
          nproc; grep -m1 "model name" /proc/cpuinfo; free -m | sed -n 2p; df -h / | tail -1
          echo "ref=${GITHUB_REF} sha=${GITHUB_SHA}"
      - name: Build image produksi dari digest
        run: docker build --build-arg PYTHON_IMAGE="$PY_DIGEST" -t video-editing:bench .
      - name: Korpus FLEURS (id_id & en_us, split test)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q "huggingface_hub>=0.24"
          python bench/p552/fleurs_corpus.py "$RUNNER_TEMP/corpus" --clean 20 --long-seconds 600 | tee corpus-summary.txt
          cp "$RUNNER_TEMP/corpus/corpus.json" .
      - name: Whisper ${{ matrix.model }} di dalam image produksi
        timeout-minutes: 150
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          mkdir -p "$RUNNER_TEMP/hf" "$RUNNER_TEMP/wout"
          chmod 777 "$RUNNER_TEMP/hf" "$RUNNER_TEMP/wout" "$RUNNER_TEMP/corpus"
          docker run --rm -e HF_HOME=/hf -e HF_HUB_OFFLINE=0 -e WHISPER_DEVICE=cpu -e VIDEO_APP_DATA=/tmp/data \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP/corpus:$RUNNER_TEMP/corpus" -v "$RUNNER_TEMP/hf:/hf" \
            -v "$RUNNER_TEMP/wout:/out" -w /src --entrypoint python video-editing:bench \
            bench/p552/whisper_quality.py "$RUNNER_TEMP/corpus" /out/whisper-${{ matrix.model }}.jsonl \
            --models ${{ matrix.model }} --runs ${{ needs.bench-config.outputs.runs }} | tee whisper-log.txt
          cp "$RUNNER_TEMP/wout/whisper-${{ matrix.model }}.jsonl" .
          du -sh "$RUNNER_TEMP/hf"
          if grep -q '"error"' whisper-${{ matrix.model }}.jsonl; then echo "ada run yang gagal"; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.0
        if: always()
        with:
          name: bench-whisper-${{ matrix.model }}
          path: |
            whisper-*.jsonl
            whisper-log.txt
            corpus.json
            corpus-summary.txt
          retention-days: 30

  bench-media:
    name: Benchmark preview & render (${{ inputs.bench }})
    needs: bench-config
    if: inputs.bench == 'smoke' || inputs.bench == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PY_DIGEST: python@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Mesin
        run: nproc; grep -m1 "model name" /proc/cpuinfo; free -m | sed -n 2p; df -h / | tail -1
      - name: Build image produksi dari digest
        run: docker build --build-arg PYTHON_IMAGE="$PY_DIGEST" -t video-editing:bench .
      - name: Aset & benchmark di dalam image produksi
        timeout-minutes: 220
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          mkdir -p "$RUNNER_TEMP/m" && chmod 777 "$RUNNER_TEMP/m"
          long=1800; [ "${{ inputs.bench }}" = full ] || long=0
          docker run --rm -e VIDEO_APP_DATA=/m/data -v "$PWD:/src:ro" -v "$RUNNER_TEMP/m:/m" -w /src \
            --entrypoint sh video-editing:bench -ec "
              ffmpeg -version | head -1
              python -m app.manage db-upgrade
              python bench/p552/assets.py /m/assets --long-seconds $long > /dev/null
              python bench/p552/media_bench.py /m/assets /m/media.jsonl --runs ${{ needs.bench-config.outputs.runs }} --mode ${{ inputs.bench }}
              python bench/p552/summarize_media.py /m/media.jsonl" | tee media-log.txt
          cp "$RUNNER_TEMP/m/media.jsonl" "$RUNNER_TEMP/m/assets/manifest.json" .
          if grep -q '"error"' media.jsonl; then echo "ada run yang gagal"; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.0
        if: always()
        with:
          name: bench-media
          path: |
            media.jsonl
            manifest.json
            media-log.txt
          retention-days: 30

  # P5.5.2 remediasi: eksperimen terisolasi (bench/p552/whisper_experiments.py). Default produksi tidak diubah:
  # variasi decoding hanya diterapkan di proses eksperimen. `conc` berjalan di container ber-batas memori = batas
  # worker-analisis compose (3g).
  bench-remediation:
    name: Remediasi P5.5.2 (${{ matrix.exp }})
    needs: bench-config
    if: inputs.bench == 'remediasi'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 3
      # Disusun oleh bench-config dari input bench_exps (default: kelima eksperimen).
      matrix: ${{ fromJSON(needs.bench-config.outputs.remediasi) }}
    env:
      PY_DIGEST: python@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159
      HF_HUB_OFFLINE: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Mesin & versi
        run: nproc; grep -m1 "model name" /proc/cpuinfo; free -m | sed -n 2p; echo "sha=${GITHUB_SHA}"
      - name: Build image produksi dari digest
        run: docker build --build-arg PYTHON_IMAGE="$PY_DIGEST" -t video-editing:bench .
      - name: Korpus FLEURS
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q "huggingface_hub>=0.24"
          python bench/p552/fleurs_corpus.py "$RUNNER_TEMP/corpus" --clean 20 --long-seconds 600 | tail -3
      - name: Eksperimen ${{ matrix.exp }} di dalam image produksi
        timeout-minutes: 210
        shell: bash --noprofile --norc -eo pipefail {0}
        run: |
          mkdir -p "$RUNNER_TEMP/hf" "$RUNNER_TEMP/xout"
          chmod 777 "$RUNNER_TEMP/hf" "$RUNNER_TEMP/xout" "$RUNNER_TEMP/corpus"
          docker run --rm --init --name "bench-${{ matrix.exp }}-${{ github.run_id }}-${{ github.run_attempt }}" ${{ matrix.docker }} -e HF_HOME=/hf -e HF_HUB_OFFLINE=0 -e WHISPER_DEVICE=cpu \
            -e VIDEO_APP_DATA=/tmp/data -v "$PWD:/src:ro" -v "$RUNNER_TEMP/corpus:$RUNNER_TEMP/corpus" \
            -v "$RUNNER_TEMP/hf:/hf" -v "$RUNNER_TEMP/xout:/out" -w /src --entrypoint python video-editing:bench \
            bench/p552/whisper_experiments.py "$RUNNER_TEMP/corpus" /out/exp-${{ matrix.exp }}.jsonl \
            --exp ${{ matrix.exp }} ${{ matrix.args }} | tee exp-log.txt
          cp "$RUNNER_TEMP/xout/exp-${{ matrix.exp }}.jsonl" .
          if grep -q '"status": "\(oom\|timeout\|killed_unverified\|error\)"\|"result": "\(OOM\|NOT_OK\)"' "exp-${{ matrix.exp }}.jsonl"; then
            echo "::warning::OOM/timeout/kegagalan proses tercatat pada eksperimen ${{ matrix.exp }} (lihat exp-${{ matrix.exp }}.jsonl)"
          fi
      - name: Hentikan container eksperimen (selesai/gagal/dibatalkan)
        if: always()
        run: docker rm -f "bench-${{ matrix.exp }}-${{ github.run_id }}-${{ github.run_attempt }}" 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.0
        if: always()
        with:
          name: remediasi-${{ matrix.exp }}
          path: |
            exp-*.jsonl
            exp-log.txt
          retention-days: 30
