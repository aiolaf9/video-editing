# P5.5.2: benchmark media nyata & Whisper ASLI di dalam image produksi (FFmpeg 7.1.5, dependensi produksi).
# Hanya manual (workflow_dispatch): mengunduh model faster-whisper & korpus FLEURS (CC-BY 4.0) dari Hugging Face.
# Hasil dicetak ke log (baris "RINGKASAN") & disimpan sebagai artifact. Tidak memakai data produksi/API berbayar.
name: Benchmark P5.5.2

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Jumlah run per skenario"
        default: "3"
      long_seconds:
        description: "Durasi aset video panjang (detik)"
        default: "1800"

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

env:
  # Digest image dasar yang sama dengan Production image run #6 (727e78e): hasil dapat dibandingkan & diulang.
  PY_DIGEST: python@sha256:aa943ce411423c7582288f18707ff66eddcbaeb510502d747a72aeb34f30d159

jobs:
  whisper:
    name: Whisper asli (${{ matrix.model }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        model: [tiny, base, small]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Mesin
        run: |
          nproc; grep -m1 "model name" /proc/cpuinfo; free -m | sed -n 2p; (nvidia-smi -L || echo "tanpa GPU")
      - name: Build image produksi dari digest
        run: docker build --build-arg PYTHON_IMAGE="$PY_DIGEST" -t video-editing:bench .
      - name: Korpus FLEURS (id_id & en_us, split test)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q "huggingface_hub>=0.24"
          python bench/p552/fleurs_corpus.py "$RUNNER_TEMP/corpus" --clean 20 --long-seconds 600 | tee corpus-summary.txt
          cp "$RUNNER_TEMP/corpus/corpus.json" .
      - name: Whisper ${{ matrix.model }} di dalam image produksi
        timeout-minutes: 150
        run: |
          mkdir -p "$RUNNER_TEMP/hf" "$RUNNER_TEMP/wout" && chmod 777 "$RUNNER_TEMP/hf" "$RUNNER_TEMP/wout" "$RUNNER_TEMP/corpus"
          docker run --rm -e HF_HOME=/hf -e HF_HUB_OFFLINE=0 -e WHISPER_DEVICE=cpu -e VIDEO_APP_DATA=/tmp/data \
            -v "$PWD:/src:ro" -v "$RUNNER_TEMP/corpus:$RUNNER_TEMP/corpus" -v "$RUNNER_TEMP/hf:/hf" \
            -v "$RUNNER_TEMP/wout:/out" -w /src --entrypoint python video-editing:bench \
            bench/p552/whisper_quality.py "$RUNNER_TEMP/corpus" /out/whisper-${{ matrix.model }}.jsonl \
            --models ${{ matrix.model }} --runs ${{ inputs.runs }} | tee whisper-log.txt
          cp "$RUNNER_TEMP/wout/whisper-${{ matrix.model }}.jsonl" .
          if grep -q '"error"' whisper-${{ matrix.model }}.jsonl; then echo "ada run yang gagal"; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.0
        if: always()
        with:
          name: whisper-${{ matrix.model }}
          path: |
            whisper-*.jsonl
            corpus.json
            corpus-summary.txt
          retention-days: 30

  media:
    name: Preview & render (format, sinkronisasi, subtitle, kualitas)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Mesin
        run: nproc; grep -m1 "model name" /proc/cpuinfo; free -m | sed -n 2p
      - name: Build image produksi dari digest
        run: docker build --build-arg PYTHON_IMAGE="$PY_DIGEST" -t video-editing:bench .
      - name: Aset & benchmark di dalam image produksi
        timeout-minutes: 220
        run: |
          mkdir -p "$RUNNER_TEMP/m" && chmod 777 "$RUNNER_TEMP/m"
          docker run --rm -e VIDEO_APP_DATA=/m/data -v "$PWD:/src:ro" -v "$RUNNER_TEMP/m:/m" -w /src \
            --entrypoint sh video-editing:bench -c '
              ffmpeg -version | head -1
              python -m app.manage db-upgrade
              python bench/p552/assets.py /m/assets --long-seconds ${{ inputs.long_seconds }} > /dev/null
              python bench/p552/media_bench.py /m/assets /m/media.jsonl --runs ${{ inputs.runs }}
              python bench/p552/summarize_media.py /m/media.jsonl' | tee media-log.txt
          cp "$RUNNER_TEMP/m/media.jsonl" "$RUNNER_TEMP/m/assets/manifest.json" .
          if grep -q '"error"' media.jsonl; then echo "ada run yang gagal"; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.0
        if: always()
        with:
          name: media
          path: |
            media.jsonl
            manifest.json
            media-log.txt
          retention-days: 30
