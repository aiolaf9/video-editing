# Override Hostinger KVM 2 (2 vCPU, 8 GB RAM). Dipakai bersama deploy/kvm2.env.example:
#   docker compose -f docker-compose.yml -f deploy/compose.kvm2.yml up -d --build
# Total batas CPU semua container 1,8 vCPU (worker berat 1,2 lewat .env + io 0,15 + web 0,2 + database 0,15 +
# Caddy 0,1); `migrate` hanya berjalan sebelum layanan lain mulai. Diuji otomatis: tests/test_p01_kvm2_profile.py.
services:
  db:
    mem_limit: 512m
    cpus: 0.15
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
  migrate:
    mem_limit: 512m
    cpus: 0.5
  web:
    mem_limit: 768m
    cpus: 0.2
  caddy:
    mem_limit: 128m
    cpus: 0.1
