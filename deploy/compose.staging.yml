# Overlay STAGING (P5.5): hardening container + isolasi jaringan worker unduhan (docs/EGRESS_DESIGN.md).
# Belum dipakai produksi; dipromosikan ke docker-compose.yml hanya setelah lolos validasi staging.
#   docker compose -f docker-compose.yml -f deploy/compose.staging.yml up -d
x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

# Proses aplikasi: root filesystem read-only; yang bisa ditulis hanya volume /data, /tmp, dan home (cache font).
x-app-hardening: &app-hardening
  <<: *hardening
  read_only: true
  tmpfs:
    - /tmp:size=1g,mode=1777
    - /home/app:size=64m,uid=1000,gid=1000,mode=0700

x-worker-health: &worker-health
  healthcheck:
    test: ["CMD", "python", "-m", "app.manage", "worker-health", "--max-age", "60"]
    interval: 30s
    timeout: 20s
    retries: 3
    start_period: 30s

services:
  db:
    networks: [default, dl-db]

  migrate:
    <<: *app-hardening

  # Hanya Caddy (jaringan edge) yang dipercaya untuk header X-Forwarded-*; worker di jaringan default tidak.
  web:
    <<: *app-hardening
    networks: [default, edge]
    environment:
      FORWARDED_ALLOW_IPS: 172.31.250.0/24

  caddy:
    <<: *hardening
    cap_add: ["NET_BIND_SERVICE"]
    networks: [edge]

  worker-analisis:
    <<: [*app-hardening, *worker-health]

  worker-render:
    <<: [*app-hardening, *worker-health]

  # Unduhan dari link = konten tidak tepercaya. Tanpa rute langsung ke internet: hanya ke database (antrean) dan
  # ke proxy keluar yang menolak IP privat/metadata. Tidak dapat menjangkau web, worker lain, maupun Caddy.
  worker-io:
    <<: [*app-hardening, *worker-health]
    networks: [dl-db, dl-egress]
    depends_on:
      egress-proxy:
        condition: service_started
    environment:
      DOWNLOAD_PROXY: http://egress-proxy:3128
      # Kunci yang tidak dibutuhkan untuk mengunduh tidak ikut masuk ke container yang memproses konten luar.
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      GEMINI_API_KEY: ""
      OPENROUTER_API_KEY: ""
      GROQ_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      ADMIN_PASSWORD: ""
      METRICS_TOKEN: ""

  egress-proxy:
    build: ./deploy/egress-proxy
    image: video-editing-egress-proxy:latest
    restart: unless-stopped
    <<: *hardening
    networks: [dl-egress, egress-out]
    mem_limit: 256m
    cpus: 0.5

networks:
  edge:
    ipam:
      config:
        - subnet: 172.31.250.0/24
  dl-db:
    internal: true
  dl-egress:
    internal: true
  egress-out: {}
