# Proxy keluar untuk worker-io (P5.5, docs/EGRESS_DESIGN.md). Hanya dapat dijangkau dari jaringan internal dl-egress.
# Squid me-resolve nama tujuan sendiri lalu memeriksa IP hasil resolusi (ACL dst) sebelum terhubung.
http_port 3128

acl to_internal dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12
acl to_internal dst 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24
acl to_internal dst 224.0.0.0/4 240.0.0.0/4
acl to_internal dst ::1 fc00::/7 fe80::/10 ff00::/8 64:ff9b::/96 2002::/16 2001::/32
acl Safe_ports port 80 443
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny to_internal
http_access allow all

# Tanpa cache, tanpa header yang membocorkan alamat internal, log ke stdout.
cache deny all
cache_mem 0 MB
forwarded_for delete
via off
connect_timeout 30 seconds
read_timeout 5 minutes
pid_filename none
cache_log /dev/stderr
access_log stdio:/dev/stdout
logfile_rotate 0
