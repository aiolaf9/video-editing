<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <meta name="description" content="Edit video jadi klip vertikal dengan subtitle otomatis.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Video Studio">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="/pwa.js" defer></script>
  <title>Masuk · AI Video Studio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand">🎬 AI Video Studio</div>
    <p class="muted">Masuk dengan akun yang diberikan admin.</p>
    <form id="loginForm">
      <label class="field">Email
        <input type="email" id="email" autocomplete="username" required autofocus>
      </label>
      <label class="field">Password
        <input type="password" id="password" autocomplete="current-password" required>
      </label>
      <p id="loginError" class="login-error" hidden></p>
      <button type="submit" class="big" id="loginBtn">Masuk</button>
    </form>
    <p class="hint">Lupa password? Hubungi admin unit Anda.</p>
  </main>
<script>
"use strict";
(async () => {
  // Sudah login? Langsung ke aplikasi.
  try { if ((await fetch("/api/auth/me")).ok) location.replace("/"); } catch { /* abaikan */ }
  // Aplikasi desktop tidak memakai login: buka lewat ikon NH AI Clip Studio.
  try {
    if ((await (await fetch("/api/desktop/info")).json()).desktop) {
      document.querySelector(".brand").textContent = "🎬 NH AI Clip Studio";
      document.getElementById("loginForm").hidden = true;
      document.querySelector(".login-card .muted").textContent =
        "Aplikasi desktop tidak memerlukan login. Tutup halaman ini lalu buka NH AI Clip Studio dari ikon di Start Menu atau desktop.";
      document.querySelector(".login-card .hint").hidden = true;
    }
  } catch { /* abaikan */ }
})();
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("loginBtn");
  const err = document.getElementById("loginError");
  btn.disabled = true;
  err.hidden = true;
  try {
    const res = await fetch("/api/auth/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: document.getElementById("email").value, password: document.getElementById("password").value }),
    });
    if (res.ok) {
      const next = new URLSearchParams(location.search).get("next") || "/";
      location.replace(next.startsWith("/") && !next.startsWith("//") ? next : "/");
      return;
    }
    const data = await res.json().catch(() => ({}));
    err.textContent = data.detail || "Gagal masuk.";
    err.hidden = false;
  } catch {
    err.textContent = "Server tidak bisa dihubungi.";
    err.hidden = false;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
