# Untuk pengembang (alembic history / alembic revision -m "..."). Aplikasi & server memakai
# `python -m app.manage db-upgrade` / `db-status` yang memakai konfigurasi yang sama dari app/migrate.py.
# URL database diambil dari DATABASE_URL (app/config.py), bukan dari file ini.
[alembic]
script_location = app/migrations
prepend_sys_path = .
file_template = %%(rev)s

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
