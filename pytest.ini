[pytest]
# Tes "heavy" butuh model Whisper asli / sumber daya besar: tidak ikut regresi biasa (CI & lokal).
# Jalankan khusus: pytest -m heavy   (mengunduh model tiny ±75 MB)
addopts = -m "not heavy"
markers =
    heavy: butuh model AI asli (unduhan), GPU, atau sumber daya besar; dijalankan terpisah
